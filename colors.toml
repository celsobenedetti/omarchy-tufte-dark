# tufte — dark variant (inverted canonical)
# Near-black paper, cream ink, a dark vermillion for errors.
# Syntax/UI hues ride a single luminance ramp instead of full color —
# vermillion (red) is the only saturated color, reserved for errors/accent.

mode = "dark"

accent = "#f57f82"
selection = "#6f8788"
muted = "#303030"

background = "#1a1006"
dark_background = "#130c04"
darker_background = "#0e0803"
lighter_background = "#261809"

foreground = "#fffcf0"
dark_foreground = "#857b6f"
light_foreground = "#c3c3c3"
bright_foreground = "#d6d6d6"

red = "#f57f82"
green = "#857b6f"
yellow = "#a2a2a2"
blue = "#b5b5b5"
magenta = "#c3c3c3"
cyan = "#d6d6d6"

bright_red = "#f57f82"
bright_green = "#857b6f"
bright_yellow = "#a2a2a2"
bright_blue = "#b5b5b5"
bright_magenta = "#c3c3c3"
bright_cyan = "#d6d6d6"
