# tufte — dark variant (inverted canonical)
# Near-black paper, cream #fffcf0 ink, a dark vermillion for errors.
# Background/foreground are the canonical paper and ink swapped.

# UI Colors (extended)
accent = "#f57f82"
cursor = "#d6d6d6"

# Primary colors
foreground = "#fffcf0"
background = "#261809"

# Selection colors
selection_foreground = "#fffcf0"
selection_background = "#6f8788"

# Normal colors (ANSI 0-7)
# 7-tier luminance ramp (T1 faint chrome, near bg -> T7 foreground) + accent on color1
color0 = "#303030"   # T1 faint chrome (near bg)
color1 = "#f57f82"   # vermillion — errors only
color2 = "#857b6f"   # T2 comments
color3 = "#a2a2a2"   # T3 operators, punctuation
color4 = "#b5b5b5"   # T4 strings, numbers
color5 = "#c3c3c3"   # T5 variables, properties
color6 = "#d6d6d6"   # T6 keywords, types
color7 = "#fffcf0"   # T7 cream foreground

# Bright colors (ANSI 8-15)
color8 = "#303030"
color9 = "#f57f82"
color10 = "#857b6f"
color11 = "#a2a2a2"
color12 = "#b5b5b5"
color13 = "#c3c3c3"
color14 = "#d6d6d6"
color15 = "#fffcf0"
